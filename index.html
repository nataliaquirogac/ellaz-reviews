<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ellaz Reviews</title>
<style>
  :root{--bg:#faf8f5;--card:#fff;--ink:#222;--mute:#888;--line:#eee;--red:#d62828;--ok:#2a9d5c}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:22px 16px 8px;text-align:center}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  header p{margin:4px 0 0;color:var(--mute);font-size:13px}
  main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
  .loc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .loc>button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;box-sizing:border-box}
  .loc .name{font-weight:600}
  .badge{font-size:12px;padding:4px 10px;border-radius:99px;background:#fdecec;color:var(--red);font-weight:600}
  .badge.done{background:#e8f6ee;color:var(--ok)}
  ul{list-style:none;margin:0;padding:0 16px 14px;display:none}
  .loc.open ul{display:block}
  li{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between}
  li.no{color:var(--red);font-weight:600}
  li.yes{color:var(--ink)}
  li span{font-size:12px;opacity:.8}
  .empty{color:var(--mute);font-style:italic}
</style>
</head>
<body>
<header>
  <h1>ELLAZ · Reviews Google</h1>
  <p>Pica una ubicación · en <b style="color:#d62828">rojo</b> quien falta</p>
</header>
<main id="app"></main>
<script>
// review: true = ya puso review, false = falta
const LOCATIONS = [
  { name: "Ubicación 1", people: [] },
  { name: "Ubicación 2", people: [] },
  { name: "Ubicación 3", people: [] },
  { name: "Ubicación 4", people: [] },
  { name: "Ubicación 5", people: [] },
  { name: "Ubicación 6", people: [] },
  { name: "Ubicación 7", people: [] },
  { name: "Ubicación 8", people: [] },
  { name: "Ubicación 9", people: [] },
  { name: "Ubicación 10", people: [] },
];

const app = document.getElementById("app");
LOCATIONS.forEach(loc => {
  const people = [...loc.people].sort((a,b) => a.name.localeCompare(b.name, "es"));
  const missing = people.filter(p => !p.review).length;
  const div = document.createElement("div");
  div.className = "loc";
  div.innerHTML = `
    <button><span class="name">${loc.name}</span>
      <span class="badge ${people.length && !missing ? "done" : ""}">${people.length ? (missing ? missing + " faltan" : "✓ completo") : "sin datos"}</span>
    </button>
    <ul>${people.length ? people.map(p => `<li class="${p.review ? "yes" : "no"}">${p.name}<span>${p.review ? "✓" : "falta"}</span></li>`).join("") : `<li class="empty">Aún no hay nombres</li>`}</ul>`;
  div.querySelector("button").onclick = () => div.classList.toggle("open");
  app.appendChild(div);
});
</script>
</body>
</html>
