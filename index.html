<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ellaz Reviews</title>
<style>
  :root{--bg:#faf8f5;--card:#fff;--ink:#222;--mute:#888;--line:#eee;--red:#d62828;--ok:#2a9d5c;--warn:#c98a00}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:22px 16px 8px;text-align:center}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  header p{margin:4px 0 0;color:var(--mute);font-size:13px}
  .legend{display:flex;gap:12px;justify-content:center;margin-top:8px;font-size:12px;font-weight:600}
  .legend .r{color:var(--red)}.legend .y{color:var(--warn)}.legend .g{color:var(--ok)}
  .adminbar{max-width:560px;margin:6px auto 0;padding:0 16px;font-size:12px;color:var(--mute);text-align:center}
  main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
  .loc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .loc img{display:block;width:100%;height:150px;object-fit:cover;cursor:pointer}
  .maps{display:block;margin:0 16px 14px;padding:11px;text-align:center;border-radius:10px;background:#222;color:#fff;text-decoration:none;font-weight:600;font-size:14px}
  .loc>button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:16px;box-sizing:border-box}
  .loc .name{font-weight:600}
  .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .badge{font-size:12px;padding:4px 10px;border-radius:99px;background:#fdecec;color:var(--red);font-weight:600;white-space:nowrap}
  .badge.y{background:#fff5d6;color:var(--warn)}
  .badge.done{background:#e8f6ee;color:var(--ok)}
  ul{list-style:none;margin:0;padding:0 16px 14px;display:none}
  .loc.open ul{display:block}
  li{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
  li.pendiente{color:var(--red);font-weight:600}
  li.revision{color:var(--warn);font-weight:600}
  li.ok{color:var(--ok)}
  li small{display:block;font-weight:400;color:var(--mute);font-size:11px}
  li .st{font-size:12px;opacity:.85;white-space:nowrap}
  li .acts{display:flex;gap:6px}
  li .acts button{border:0;border-radius:8px;padding:6px 10px;font-weight:600;font-size:12px;cursor:pointer}
  .bok{background:var(--ok);color:#fff}.bno{background:#eee;color:#444}
  .empty{color:var(--mute);font-style:italic;cursor:default}
  dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,380px)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog h3{margin:0 0 6px;font-size:17px}
  dialog p{margin:0 0 12px;color:#555;font-size:14px}
  dialog input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-bottom:12px}
  dialog .row{display:flex;gap:8px;justify-content:flex-end}
  dialog button{border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer}
  .primary{background:#222;color:#fff}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;display:none}
</style>
</head>
<body>
<header>
  <h1>ELLAZ · Reviews Google</h1>
  <p>Pica una ubicación y luego tu nombre cuando ya hayas dejado tu review</p>
  <div class="legend"><span class="r">● falta</span><span class="y">● en revisión</span><span class="g">● listo</span></div>
</header>
<div class="adminbar" id="adminbar"></div>
<main id="app"></main>
<dialog id="dlg">
  <h3 id="dlgTitle"></h3>
  <p>¿Ya dejaste tu review en Google? Escribe tu nombre como aparece en Google para que la podamos encontrar.</p>
  <input id="dlgGoogle" placeholder="Tu nombre en Google" autocomplete="name">
  <div class="row"><button id="dlgCancel">Cancelar</button><button class="primary" id="dlgSend">Ya la hice ✓</button></div>
</dialog>
<div class="toast" id="toast"></div>
<script>
// URL de la app web de Apps Script (ver apps-script/Code.gs)
const API = "https://script.google.com/macros/s/AKfycbwDqUAkPU2-vTUaESRdRXUQTgOHQD7envZ_ixNVfmH1pQX_Lz8NLVHcWx08deaAdryJew/exec";

// Equipo que debe dejar review (mismo para todas las ubicaciones)
const TEAM = [
    "Grecia Arq",
    "Jc Angeles Ellaz",
    "Vale Ayala",
    "Or Ben Galim",
    "Sylvia Ben Galim",
    "Esthela Bazaq",
    "Emilia Celis",
    "Escarlet Cisneros",
    "Pau Chapa",
    "Raquel Chapa",
    "Karen Daniela Ellaz",
    "Elo Ellaz Arcos",
    "Ana Emilia Ellaz",
    "Cura Ellaz",
    "Daniela Ellaz",
    "Emilia",
    "Fanny Ellaz",
    "Mabee Ellaz",
    "Moni Ellaz",
    "Susy Ellaz",
    "Xime Ellaz Calzada",
    "GS",
    "Michelle Gtz",
    "Anel Herrera",
    "Arturo Hdez Cancun Ellaz",
    "Marcelo Hernandez",
    "Pau Hintze",
    "Vale Huerta",
    "Sofia IMBulnes Ellaz",
    "Ari Lpz",
    "Regina Laviada",
    "Trisha Lee",
    "Wicho Luis Ellaz",
    "Chuy Distrital Mty",
    "Irving Narvaez Ellaz",
    "Eduardo Operaciones Ellaz",
    "Patsy",
    "Paulina",
    "Pam Sada Ellaz",
    "Juan Pablo Sada JP",
    "Samanta",
    "Jimena Ugalde Ellaz",
    "Eduardo Video",
    "Ivanna Villagomez",
    "Catalina Zertuche",
    "Dilan Alvarez Tio Ben",
    "Vale Contreras Tio Ben",
    "Jaime Martinez Tio Ben",
    "Pamela Rdz Tio Ben",
    "Karen Tio Ben",
    "Fer Guerra",
    "Vis",
    "Pablo Zubieta",
    "Barbara",
    "GLM",
    "Gutierrez",
    "Marcelo Elizondo",
    "+52 81 3120 5088",
    "Angel Galim Health"
];

// verified = los que ya vi en Google (salen en verde). Reviews de hace 1 año o más NO cuentan.
const LOCATIONS = [
  { name: "Punto Valle", photo: "img/punto-valle.jpg", maps: "https://maps.app.goo.gl/JVkezuU9xg7hu78T7", people: TEAM,
    verified: ["Anel Herrera", "Dilan Alvarez Tio Ben", "Eduardo Operaciones Ellaz", "Eduardo Video", "Elo Ellaz Arcos", "Jimena Ugalde Ellaz", "Pablo Zubieta", "Pamela Rdz Tio Ben", "Vale Contreras Tio Ben"] },
  { name: "Calzada", photo: "img/calzada.jpg", maps: "https://maps.app.goo.gl/KNAbSSFj9gS1iehz5", people: TEAM,
    verified: ["Barbara", "Dilan Alvarez Tio Ben", "Eduardo Operaciones Ellaz", "Emilia Celis", "Jimena Ugalde Ellaz", "Karen Tio Ben", "Samanta", "Vale Contreras Tio Ben"] },
  { name: "Fashion Drive", photo: "img/fashion-drive.jpg", maps: "https://maps.app.goo.gl/vdgWGp3ooaumGg6v6", people: TEAM,
    verified: ["Anel Herrera", "Emilia Celis", "Jimena Ugalde Ellaz", "Karen Tio Ben", "Regina Laviada", "Vale Contreras Tio Ben"] },
  { name: "San Agustín", photo: "img/san-agustin.jpg", maps: "https://maps.app.goo.gl/GzEX9MtAp1hLs6yd7", people: TEAM,
    verified: ["Eduardo Operaciones Ellaz", "Jc Angeles Ellaz", "Jimena Ugalde Ellaz", "Mabee Ellaz", "Pablo Zubieta", "Pamela Rdz Tio Ben", "Trisha Lee", "Vale Contreras Tio Ben", "Vale Huerta"] },
  { name: "Ubicación 5", people: [] },
  { name: "Ubicación 6", people: [] },
  { name: "Ubicación 7", people: [] },
  { name: "Ubicación 8", people: [] },
  { name: "Ubicación 9", people: [] },
  { name: "Ubicación 10", people: [] },
];

const KEY = (loc, name) => loc + "|" + name;
let STATUS = {};          // "loc|name" -> {status, google}
let PIN = null;
try { PIN = localStorage.getItem("ellazPin"); } catch (e) {}
const isAdmin = () => !!PIN;
const openLocs = new Set();
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2500);
}

async function api(body) {
  const r = await fetch(API, { method: "POST", body: JSON.stringify(body) });
  return r.json();
}

async function load() {
  if (!API) return render();
  try {
    const r = await fetch(API).then(r => r.json());
    STATUS = {};
    r.rows.forEach(x => STATUS[KEY(x.loc, x.name)] = { status: x.status, google: x.google });
  } catch (e) { toast("No se pudo cargar el estado"); }
  render();
}

function render() {
  app.innerHTML = "";
  LOCATIONS.forEach(loc => {
    const people = [...loc.people].sort((a, b) => a.localeCompare(b, "es"))
      .map(n => ({ name: n, ...(STATUS[KEY(loc.name, n)] || { status: (loc.verified || []).includes(n) ? "ok" : "pendiente", google: "" }) }));
    const c = { pendiente: 0, revision: 0, ok: 0 };
    people.forEach(p => c[p.status] = (c[p.status] || 0) + 1);
    const div = document.createElement("div");
    div.className = "loc" + (openLocs.has(loc.name) ? " open" : "");
    const badges = !people.length ? `<span class="badge">sin datos</span>`
      : !c.pendiente && !c.revision ? `<span class="badge done">✓ completo</span>`
      : (c.pendiente ? `<span class="badge">${c.pendiente} faltan</span>` : "") + (c.revision ? `<span class="badge y">${c.revision} en revisión</span>` : "");
    div.innerHTML = `
      ${loc.photo ? `<img src="${loc.photo}" alt="${esc(loc.name)}">` : ""}
      <button class="head"><span class="name">${esc(loc.name)}</span><span class="badges">${badges}</span></button>
      ${loc.maps ? `<a class="maps" href="${loc.maps}" target="_blank" rel="noopener">📍 Abrir en Google Maps · dejar review</a>` : ""}
      <ul>${people.length ? people.map((p, i) => `
        <li class="${p.status}" data-i="${i}">
          <div>${esc(p.name)}${p.google && isAdmin() ? `<small>Google: ${esc(p.google)}</small>` : ""}</div>
          ${isAdmin() && p.status === "revision"
            ? `<span class="acts"><button class="bok" data-a="approve">OK</button><button class="bno" data-a="reject">✗</button></span>`
            : isAdmin() && p.status === "ok"
            ? `<span class="acts"><button class="bno" data-a="reject">deshacer</button></span>`
            : `<span class="st">${p.status === "ok" ? "✓ listo" : p.status === "revision" ? "en revisión" : "falta"}</span>`}
        </li>`).join("") : `<li class="empty">Aún no hay nombres</li>`}</ul>`;
    const toggle = () => { div.classList.toggle("open"); div.classList.contains("open") ? openLocs.add(loc.name) : openLocs.delete(loc.name); };
    div.querySelector(".head").onclick = toggle;
    const img = div.querySelector("img"); if (img) img.onclick = toggle;
    div.querySelectorAll("li[data-i]").forEach(li => {
      const p = people[+li.dataset.i];
      li.onclick = async e => {
        const a = e.target.dataset && e.target.dataset.a;
        if (a) return adminAction(a, loc.name, p.name);
        if (p.status === "pendiente") openSubmit(loc.name, p.name);
        else if (!isAdmin()) toast(p.status === "ok" ? "Ya está aprobada ✓" : "Ya la mandaste, está en revisión");
      };
    });
    app.appendChild(div);
  });
  document.getElementById("adminbar").innerHTML = isAdmin()
    ? `Modo admin · <a href="#" id="logout">salir</a>` : "";
  const lo = document.getElementById("logout");
  if (lo) lo.onclick = e => { e.preventDefault(); PIN = null; try { localStorage.removeItem("ellazPin"); } catch (e) {} render(); };
}

const dlg = document.getElementById("dlg");
let pending = null;
function openSubmit(loc, name) {
  if (!API) return toast("Todavía no está conectado");
  pending = { loc, name };
  document.getElementById("dlgTitle").textContent = name;
  document.getElementById("dlgGoogle").value = "";
  dlg.showModal();
}
document.getElementById("dlgCancel").onclick = () => dlg.close();
document.getElementById("dlgSend").onclick = async () => {
  const google = document.getElementById("dlgGoogle").value.trim();
  if (!google) return document.getElementById("dlgGoogle").focus();
  const btn = document.getElementById("dlgSend"); btn.disabled = true;
  try {
    const r = await api({ action: "submit", loc: pending.loc, name: pending.name, google });
    if (!r.ok) throw 0;
    STATUS[KEY(pending.loc, pending.name)] = { status: r.status, google };
    dlg.close(); render(); toast("¡Gracias! Quedó en revisión 💛");
  } catch (e) { toast("No se pudo enviar, intenta otra vez"); }
  btn.disabled = false;
};

async function adminAction(action, loc, name) {
  try {
    const r = await api({ action, pin: PIN, loc, name });
    if (!r.ok) return toast(r.error || "Error");
    const cur = STATUS[KEY(loc, name)] || {};
    STATUS[KEY(loc, name)] = { ...cur, status: r.status };
    render();
  } catch (e) { toast("Error de conexión"); }
}

// Modo admin: abrir la página con ?admin
if (new URLSearchParams(location.search).has("admin") && !PIN && API) {
  const p = prompt("PIN de admin");
  if (p) api({ action: "check", pin: p }).then(r => {
    if (r.ok) { PIN = p; try { localStorage.setItem("ellazPin", p); } catch (e) {} render(); toast("Modo admin activado"); }
    else toast("PIN incorrecto");
  });
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
